name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker toolchain
        run: docker build -t my-os buildenv/

      - name: Build release kernel
        run: docker run --rm -v ${{ github.workspace }}:/root/env my-os make

      - name: Build debug kernel
        run: |
          docker run --rm -v ${{ github.workspace }}:/root/env my-os make clean
          docker run --rm -v ${{ github.workspace }}:/root/env my-os make BUILD=debug

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Rebuild release for smoke test
        run: |
          docker run --rm -v ${{ github.workspace }}:/root/env my-os make clean
          docker run --rm -v ${{ github.workspace }}:/root/env my-os make

      - name: Run smoke test
        run: bash scripts/smoke-test.sh dist/x86_64/kernel.iso 20

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-iso
          path: dist/x86_64/kernel.iso
          retention-days: 7

  # Publish the tested ISO and tell willcodesthings.github.io to redeploy with it.
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: os-latest
      SITE_REPO: WillCodesThings/willcodesthings.github.io

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-iso

      - name: Write build info
        run: |
          cat > os-build.json <<JSON
          {
            "sha": "${{ github.sha }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          }
          JSON
          cat os-build.json

      - name: Publish rolling release
        run: |
          notes="Latest kernel.iso built from ${{ github.sha }}. Updated automatically by CI."
          if gh release view "$RELEASE_TAG" -R "${{ github.repository }}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$RELEASE_TAG" \
              -f sha="${{ github.sha }}" -F force=true > /dev/null
            gh release edit "$RELEASE_TAG" -R "${{ github.repository }}" --notes "$notes"
            gh release upload "$RELEASE_TAG" kernel.iso os-build.json -R "${{ github.repository }}" --clobber
          else
            gh release create "$RELEASE_TAG" kernel.iso os-build.json -R "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "Latest build" --notes "$notes" --prerelease
          fi

      - name: Trigger website deploy
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; the website will pick up this ISO on its next deploy."
            exit 0
          fi
          GH_TOKEN="$SITE_DISPATCH_TOKEN" gh api "repos/$SITE_REPO/dispatches" \
            -f event_type=os-updated -f "client_payload[sha]=${{ github.sha }}"
